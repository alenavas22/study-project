[project]
name = "etl"
version = "0.1.0"
description = "ETL package for MOFs dataset"
readme = "README.md"
authors = [
    { name = "Alena", email = "vas.alena.22@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gdown>=6.4.1",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "wget>=3.2",
]

[project.scripts]
etl = "etl.main:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
